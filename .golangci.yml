version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
